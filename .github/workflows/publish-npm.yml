# This workflow publishes tagged releases from the public production repository.
name: Publish NPM
on:
  # Manual retries must target an existing release tag, for example:
  # gh workflow run publish-npm.yml --ref v0.36.0
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    # Releases are cut in node-sdk-private and promoted here; only the public repo publishes,
    # so npm provenance points at privy-io/node-sdk.
    if: github.repository == 'privy-io/node-sdk' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: package-release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          bash ./bin/publish-npm
