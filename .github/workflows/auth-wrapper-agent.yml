name: Auth Wrapper Agent

# Finds generated methods that take `privy-authorization-signature` but have no
# custom wrapper in src/public-api/, asks Claude to write the wrappers with the
# gen-auth-wrapper skill, and opens a draft PR against the checked branch.
#
# Today this only runs on monorepo PR preview branches (never promoted). To run it
# on generated updates to main later, add `main` to the push branches and keep
# the builder-blobby actor check.

on:
  push:
    branches:
      # `*` does not match `/`, so preview/base/monorepo-pr-* is excluded.
      - 'preview/monorepo-pr-*'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to check, e.g. preview/monorepo-pr-12345'
        required: true

concurrency:
  group: auth-wrapper-agent-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-wrappers:
    name: generate-wrappers
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Only react to stlc generation pushes, or to a manual run.
    if: |
      github.repository == 'privy-io/node-sdk-private' &&
      (github.event_name == 'workflow_dispatch' || github.actor == 'builder-blobby[bot]')
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SDK_AUTOMATION }}
      REPORT_FILE: .auth-wrapper-report.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Generate missing wrappers
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        # Same staging test-app credentials as the `test` job in ci.yml, so the
        # agent can run the integration tests it writes.
        env:
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          TEST_APP_ID: ${{ secrets.TEST_APP_ID }}
          TEST_APP_SECRET: ${{ secrets.TEST_APP_SECRET }}
          JWT_AUTH_SK: ${{ secrets.JWT_AUTH_SK }}
          TEST_APP_TEST_ACCOUNT_OTP: ${{ secrets.TEST_APP_TEST_ACCOUNT_OTP }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "Skill,Read,Edit,Write,Glob,Grep,Bash(./scripts/format),Bash(./scripts/lint),Bash(./scripts/test --testPathIgnorePatterns=tests/integration),Bash(yarn test:integration:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*)"
          prompt: |
            You are running in CI on branch `${{ env.TARGET_BRANCH }}` of ${{ github.repository }}.
            There is no human to answer questions.

            Follow `.claude/skills/gen-auth-wrapper/SKILL.md` with the input `all`.

            Rules:
            - Only edit files. Do not commit, push, or open a PR. A later workflow step does that.
            - If there are no missing wrappers, change no files.
            - After lint passes, run the offline tests with
              `./scripts/test --testPathIgnorePatterns=tests/integration`, and run each integration
              test file you created or changed with `yarn test:integration <file>`. Fix failures
              in the code you wrote. Do not skip a test only to make it pass; use `it.skip` only
              for the reasons the skill gives.
            - When you finish, write the skill's Output report as Markdown to `${{ env.REPORT_FILE }}`
              in the repo root. Start it with one line: either `No missing wrappers` or
              `Added wrappers: <comma-separated public method paths>`.
              List which tests ran, which are skipped and why, and any failures that remain.

      - name: Move agent report out of the tree
        run: |
          REPORT="$RUNNER_TEMP/auth-wrapper-report.md"
          if [ -f "$REPORT_FILE" ]; then mv "$REPORT_FILE" "$REPORT"; else echo "Claude did not write a report." > "$REPORT"; fi

      # Re-check the agent's work without the agent, so the result can be trusted.
      - name: Verify wrappers
        id: verify
        env:
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          TEST_APP_ID: ${{ secrets.TEST_APP_ID }}
          TEST_APP_SECRET: ${{ secrets.TEST_APP_SECRET }}
          JWT_AUTH_SK: ${{ secrets.JWT_AUTH_SK }}
          TEST_APP_TEST_ACCOUNT_OTP: ${{ secrets.TEST_APP_TEST_ACCOUNT_OTP }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG="$RUNNER_TEMP/verify.log"
          STATUS=passed
          ./scripts/lint > "$LOG" 2>&1 || STATUS=failed
          ./scripts/test --testPathIgnorePatterns=tests/integration >> "$LOG" 2>&1 || STATUS=failed

          TEST_FILES=$(git status --porcelain --untracked-files=all -- tests/integration | awk '{print $NF}' | grep -E '\.test\.ts$' || true)
          if [ -n "$TEST_FILES" ]; then
            # shellcheck disable=SC2086
            yarn test:integration $TEST_FILES >> "$LOG" 2>&1 || STATUS=failed
          fi

          echo "result=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Verification: $STATUS"
            echo
            echo "Ran \`./scripts/lint\`, offline tests, and: ${TEST_FILES:-no integration test files}"
            echo
            echo '<details><summary>Log (last 100 lines)</summary>'
            echo
            echo '```'
            tail -n 100 "$LOG"
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/verify.md"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="$RUNNER_TEMP/auth-wrapper-report.md"
          echo "summary=$(head -n 1 "$REPORT")" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain)" ]; then
            echo "result=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="auth-wrappers/$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "feat: add auth wrappers for $TARGET_BRANCH"
          git push --force origin "$BRANCH"

          {
            echo "Generated by the [Auth Wrapper Agent](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on \`$TARGET_BRANCH\`."
            echo
            cat "$REPORT"
            echo
            cat "$RUNNER_TEMP/verify.md" 2>/dev/null || true
          } > "$RUNNER_TEMP/pr-body.md"

          URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$URL" ]; then
            gh pr edit "$URL" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            URL=$(gh pr create --draft --base "$TARGET_BRANCH" --head "$BRANCH" \
              --title "feat: add auth wrappers for $TARGET_BRANCH" \
              --body-file "$RUNNER_TEMP/pr-body.md")
          fi
          echo "result=opened" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          RESULT: ${{ steps.pr.outputs.result }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SUMMARY: ${{ steps.pr.outputs.summary }}
          VERIFY: ${{ steps.verify.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SOURCE="\`$TARGET_BRANCH\`"
          if [[ "$TARGET_BRANCH" =~ ^preview/monorepo-pr-([0-9]+)$ ]]; then
            SOURCE="<https://github.com/privy-io/privy/pull/${BASH_REMATCH[1]}|privy-io/privy#${BASH_REMATCH[1]}>"
          fi

          if [ "$JOB_STATUS" != "success" ]; then
            RESULT_TEXT=":x: Agent run failed. <$RUN_URL|View logs>"
          elif [ "$RESULT" = "opened" ]; then
            if [ "$VERIFY" = "passed" ]; then VERIFY_TEXT=":white_check_mark: lint and tests passed"; else VERIFY_TEXT=":warning: lint or tests failed, see PR"; fi
            RESULT_TEXT=":sparkles: $SUMMARY"$'\n'"$VERIFY_TEXT"$'\n'"Draft PR: <$PR_URL|review wrappers>"
          else
            RESULT_TEXT=":zzz: No missing wrappers."
          fi

          TEXT=":robot_face: *Auth wrapper check: ${GITHUB_REPOSITORY#*/}*"$'\n'"Source: $SOURCE"$'\n'"$RESULT_TEXT"
          jq -n --arg text "$TEXT" '{text: $text}' | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
