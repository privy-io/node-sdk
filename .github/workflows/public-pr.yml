name: Public PR

# Public main only moves when stlc-promote releases, so PRs in privy-io/node-sdk must not be
# merged there. Fail them as a reminder to import them instead (see CONTRIBUTING.md).
on: pull_request_target

permissions: {}

jobs:
  do-not-merge:
    if: github.repository == 'privy-io/node-sdk'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::error title=Do not merge here::Import this PR into privy-io/node-sdk-private (see CONTRIBUTING.md), then close it." && exit 1
